<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable Declaration</title>
</head>
<body>

    <script>
        
        // keyword variable_name = value;

        var userName = "Front End Development";
        let email = "abc@gmail.com";
        const age = 25;

        console.log(userName);
        console.log(email);
        console.log(age);

    </script>

</body>
</html>
